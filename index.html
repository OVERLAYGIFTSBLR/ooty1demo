<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Permissions-Policy" content="camera=*">
<title>AR Menu – 3D Dish Try-On</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,.18);--gold-border:rgba(201,168,76,.28);--ink:#0A0A0A;--cream:#F5F0E8;--glass-dark:rgba(6,5,4,.72);--radius-pill:100px;--text-main:#FFD76A;--text-sub:#FFFFFF}
html,body{width:100%;height:100%;font-family:'Jost',sans-serif;background:#060504;overflow:hidden;overscroll-behavior:none;position:fixed;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
.a-enter-vr-button{display:none!important}
a-scene{position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;z-index:0!important}
canvas.a-canvas{width:100%!important;height:100%!important;position:fixed!important;top:0!important;left:0!important}
video{position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:-1!important}

/* START */
#startScreen{position:fixed;inset:0;background:#060504;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:40px 32px;transition:opacity .4s}
.start-inner{display:flex;flex-direction:column;align-items:center;max-width:320px;width:100%}
.start-ornament{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.start-ornament-line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.start-ornament-line.right{background:linear-gradient(90deg,var(--gold),transparent)}
.start-ornament-diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
img.start-logo{width:140px;height:140px;object-fit:contain;margin-bottom:44px;filter:brightness(0) invert(1) sepia(1) saturate(.6)}
.start-eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
#startScreen h1{font-family:'Cormorant Garamond',serif;color:var(--cream);font-size:36px;font-weight:300;line-height:1.15;text-align:center;margin-bottom:20px}
#startScreen h1 em{font-style:italic;color:var(--gold-light)}
#startScreen p.desc{color:rgba(245,240,232,.42);font-size:13px;font-weight:300;text-align:center;line-height:1.75;margin-bottom:36px}
#startBtn,#retryBtn{padding:16px 42px;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--gold-border);border-radius:var(--radius-pill);background:transparent;color:var(--gold-light);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#startBtn:active{background:var(--gold);color:var(--ink)}
#retryBtn{margin-top:8px;padding:12px 28px;font-size:11px}

/* LOADING / ERROR */
#loadingOverlay,#errorOverlay{position:fixed;inset:0;background:#060504;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:998;gap:20px;padding:36px;text-align:center}
#loadingOverlay.show,#errorOverlay.show{display:flex}
.loading-ring{width:56px;height:56px;border:1px solid rgba(201,168,76,.15);border-top-color:var(--gold);border-radius:50%;animation:spin 1.2s linear infinite}
#loadingStatus{color:rgba(245,240,232,.4);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
#errorOverlay h2{font-family:'Cormorant Garamond',serif;color:#ff8080;font-size:22px;font-weight:400}
#errorOverlay p{color:rgba(245,240,232,.4);font-size:13px;line-height:1.8;font-weight:300;max-width:300px}
#modelLoader{position:fixed;top:174px;left:50%;transform:translateX(-50%);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gold-border);border-radius:var(--radius-pill);padding:7px 18px;color:rgba(245,240,232,.6);font-size:10px;letter-spacing:.14em;text-transform:uppercase;z-index:300;display:none;align-items:center;gap:9px}
#modelLoader.show{display:flex}
.ml-col{display:flex;flex-direction:column;gap:5px}
.ml-bar{width:120px;height:3px;border-radius:3px;background:rgba(201,168,76,.2);overflow:hidden}
#mlFill{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;transition:width .2s ease}
#modelLoader.indet #mlFill{width:40%!important;animation:mlSlide 1.1s ease-in-out infinite}
@keyframes mlSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#mlPct{font-weight:500;color:var(--gold-light);min-width:30px;text-align:right;font-size:10px;letter-spacing:.06em}
.mini-spin{width:11px;height:11px;border:1.5px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}

/* LOGO / CAROUSEL */
#logo{position:fixed;top:14px;left:14px;width:60px;z-index:200;opacity:0;pointer-events:none;transition:opacity .5s;filter:brightness(0) invert(1) sepia(1) saturate(.5)}
#dishCarousel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;overflow-x:auto;max-width:calc(100vw - 20px);padding:10px 16px;background:var(--glass-dark);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gold-border);border-radius:60px;scrollbar-width:none;z-index:150;opacity:0;pointer-events:none;transition:opacity .5s}
#dishCarousel::-webkit-scrollbar{display:none}
.dish-thumb{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;padding:4px 6px;border-radius:50px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .25s}
.dish-thumb.active{background:var(--gold-dim)}
.thumb-img-wrap{width:50px;height:50px}
.dish-thumb img{width:50px;height:50px;object-fit:cover;border-radius:50%;border:1.5px solid rgba(201,168,76,.15);transition:.25s;pointer-events:none;display:block}
.dish-thumb.active img{border-color:var(--gold);transform:scale(1.06)}
.dish-thumb span{font-size:8.5px;letter-spacing:.05em;color:var(--text-sub);font-weight:700;text-align:center;max-width:58px;line-height:1.3;text-transform:uppercase}
.dish-thumb.active span{color:var(--text-main)}

/* SCAN HINT */
#scanHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none;z-index:10;opacity:0;transition:opacity .5s}
.scan-frame{position:relative;width:180px;height:180px;border:1px dashed rgba(201,168,76,.35);border-radius:6px}
.scan-line{position:absolute;left:8px;right:8px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scanLine 2.4s ease-in-out infinite}
@keyframes scanLine{0%,100%{top:8px;opacity:0}10%,90%{opacity:1}50%{top:calc(100% - 8px)}}
#scanHint p{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,240,232,.45)}

/* SWIPE */
#swipeZone{position:fixed;inset:0;z-index:100;touch-action:pan-y;pointer-events:none}
#swipeZone.active{pointer-events:auto}
#swipeHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;gap:24px;pointer-events:none;z-index:200;opacity:0;transition:opacity .4s}
#swipeHint.show{opacity:1}
.swipe-arrow{display:flex;flex-direction:column;align-items:center;gap:6px}
.swipe-arrow-icon{width:44px;height:44px;border:1px solid var(--gold-border);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-dark)}
.swipe-arrow-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.swipe-arrow span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,240,232,.4)}
#dishCounter{display:none!important}
#swipeFlash{position:fixed;inset:0;pointer-events:none;z-index:99;opacity:0}
#swipeFlash.left{background:linear-gradient(to right,rgba(201,168,76,.06),transparent)}
#swipeFlash.right{background:linear-gradient(to left,rgba(201,168,76,.06),transparent)}
#swipeFlash.flash{animation:flashFade .35s ease-out forwards}
@keyframes flashFade{0%{opacity:1}100%{opacity:0}}

/* HIDDEN HUD & BUTTONS */
#hudCard,
#snapBtn,
#soundBtn {
  display: none !important;
}

@supports(padding-bottom:env(safe-area-inset-bottom)){
#dishCarousel{bottom:calc(20px + env(safe-area-inset-bottom))}}
@media(max-width:390px){.dish-thumb img,.thumb-img-wrap{width:42px;height:42px}#startScreen h1{font-size:30px}}

/* UI CONTROLS */
#actionBar{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);display:flex;gap:8px;width:calc(100vw - 28px);max-width:420px;z-index:170;opacity:0;pointer-events:none;transition:opacity .5s}
#actionBar a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:100px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold-border);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--gold-light);-webkit-tap-highlight-color:transparent}
#actionBar a.primary{flex:1.7;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-weight:500;border-color:var(--gold)}
#spinToast{position:fixed;top:174px;left:50%;transform:translateX(-50%);z-index:210;padding:7px 16px;border-radius:100px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--glass-dark);border:1px solid var(--gold-border);color:var(--gold-light);opacity:0;pointer-events:none;transition:opacity .3s}
#spinToast.show{opacity:1}
#modeToggle{position:fixed;left:50%;bottom:186px;transform:translateX(-50%);z-index:170;display:flex;padding:3px;border-radius:100px;border:1px solid var(--gold-border);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .5s}
#modeToggle button{min-height:34px;padding:0 16px;border:0;border-radius:100px;background:transparent;color:rgba(245,240,232,.6);font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
#modeToggle button.on{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-weight:500}

/* START BUTTON */
#startBtn{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;gap:12px;
  padding:18px 40px;
  font-family:'Jost',sans-serif;font-size:13px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  color:#1a1305;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  border:1px solid var(--gold-light);
  border-radius:var(--radius-pill);
  box-shadow:0 0 0 4px rgba(201,168,76,.12),0 10px 30px rgba(201,168,76,.28);
  animation:startPulse 2.6s ease-in-out infinite;
  transition:transform .2s ease,box-shadow .2s ease;
}
#startBtn::after{content:'→';font-size:16px;letter-spacing:0;transition:transform .25s ease}
#startBtn::before{
  content:'';position:absolute;top:0;left:-70%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);
  animation:startShine 3.4s ease-in-out infinite;
}
#startBtn:active{
  transform:scale(.96);
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#1a1305;
  box-shadow:0 0 0 2px rgba(201,168,76,.25),0 4px 14px rgba(201,168,76,.3);
}
#startBtn:active::after{transform:translateX(4px)}
@keyframes startShine{0%{left:-70%}55%,100%{left:130%}}
@keyframes startPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(201,168,76,.12),0 10px 30px rgba(201,168,76,.28)}
  50%{box-shadow:0 0 0 9px rgba(201,168,76,.05),0 10px 38px rgba(201,168,76,.45)}
}

/* RESPONSIVE LAYOUT */
#dishCarousel{left:0!important;right:0!important;bottom:0!important;transform:none!important;width:100%!important;max-width:100%!important;
  justify-content:space-around;gap:4px;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;border-left:0;border-right:0;border-bottom:0}
.dish-thumb{flex:1 0 auto}
#actionBar{left:0!important;right:0!important;transform:none!important;width:100%!important;max-width:100%!important;gap:6px;padding:0 6px;
  bottom:calc(112px + env(safe-area-inset-bottom,0px))!important}
#modeToggle{left:0!important;right:0!important;transform:none!important;width:calc(100% - 12px);margin:0 6px;
  bottom:calc(164px + env(safe-area-inset-bottom,0px))!important}
#modeToggle button{flex:1;padding:0 6px}

/* FALLBACK 3D VIEWER */
#fallback{position:fixed;inset:0;z-index:1000;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 35%,#1b1610,#060504 70%)}
#fallback.show{display:flex}
#fbTop{padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#fbName{min-height:34px;padding:0 22px;display:flex;align-items:center;border-radius:100px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#fbNote{font-size:11px;color:rgba(245,240,232,.5);letter-spacing:.03em;line-height:1.5;max-width:320px}
#fbViewer{display:block;flex:1;width:100%;min-height:0;background:transparent;--poster-color:transparent}
#fbAR,#fbFromErr,#fbRetry,#fbLink{font-family:'Jost',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#fbAR{display:none;align-items:center;justify-content:center;margin:0 auto 10px;min-height:44px;padding:0 26px;border-radius:100px;border:1px solid var(--gold-border);background:var(--glass-dark);color:var(--gold-light);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
#fbAR.show{display:flex}
#fbBar{display:flex;gap:6px;padding:0 6px 8px}
#fbBar a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:100px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold-border);background:var(--glass-dark);color:var(--gold-light)}
#fbBar a.primary{flex:1.7;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-weight:500;border-color:var(--gold)}
#fbCarousel{display:flex;justify-content:space-around;gap:4px;overflow-x:auto;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--glass-dark);border-top:1px solid var(--gold-border);border-radius:22px 22px 0 0;scrollbar-width:none}
#fbCarousel::-webkit-scrollbar{display:none}
#fbRetry{background:none;border:0;color:var(--gold-light);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;padding:4px}
#fbFromErr{padding:14px 30px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:100px;border:1px solid var(--gold);background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-weight:500}
#fbLink{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:220;display:none;white-space:nowrap;padding:9px 18px;border-radius:100px;border:1px solid var(--gold-border);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--gold-light);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
#fbLink.show{display:block}
</style>
</head>
<body>

<div id="startScreen"><div class="start-inner">
  <img class="start-logo" src="logo1.png" onerror="this.style.display='none'" alt="Logo">
  <button id="startBtn">See Dishes in 3D</button>
</div></div>

<div id="loadingOverlay"><div class="loading-ring"></div><p id="loadingStatus">Starting camera</p></div>
<div id="modelLoader"><div class="mini-spin"></div><div class="ml-col"><span id="mlText">Loading dish</span><div class="ml-bar"><i id="mlFill"></i></div></div><b id="mlPct"></b></div>

<div id="errorOverlay">
  <h2>Camera Access Denied</h2>
  <p>Please allow camera access in your browser settings and try again.<br><br>
  <strong style="color:rgba(245,240,232,.6)">iPhone:</strong> Settings → Safari → Camera → Allow<br>
  <strong style="color:rgba(245,240,232,.6)">Android:</strong> Settings → Apps → Browser → Camera → Allow</p>
  <button id="fbFromErr">View dishes in 3D</button>
  <button id="retryBtn">Retry</button>
</div>

<img src="logo1.png" id="logo" alt="Logo">

<div id="swipeHint">
  <div class="swipe-arrow"><div class="swipe-arrow-icon"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><span>Prev</span></div>
  <div class="swipe-arrow"><div class="swipe-arrow-icon"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><span>Next</span></div>
</div>
<div id="swipeFlash"></div>
<div id="swipeZone"></div>

<div id="spinToast"></div>
<div id="recPill">● REC <span id="recT"></span></div>

<div id="modeToggle"><button data-m="card" class="on">View on card</button><button data-m="table">View on table</button></div>
<div id="actionBar">
  <a data-a="reserve" class="primary" target="_blank" rel="noopener">Reserve Table</a>
  <a data-a="directions" target="_blank" rel="noopener">Directions</a>
  <a data-a="call">Call</a>
</div>

<div id="scanHint"><div class="scan-frame"><div class="scan-line"></div></div><p>Point at menu card</p></div>
<div id="dishCarousel"></div>
<button id="fbLink">Can't scan? View in 3D</button>
<div id="fallback">
  <div id="fbTop"><div id="fbName"></div><div class="tags" id="fbTags"></div><div id="fbNote"></div><button id="fbRetry">Try camera again</button></div>
  <model-viewer id="fbViewer" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="28deg" shadow-intensity="1" exposure="1.05" interaction-prompt="none" ar ar-placement="floor" ar-scale="auto" loading="eager"></model-viewer>
  <button id="fbAR">View on table</button>
  <div id="fbBar"></div>
  <div id="fbCarousel"></div>
</div>

<a-scene id="arScene" gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/"
  mindar-image="imageTargetSrc: ./targets/card.mind; filterMinCF: 0.1; filterBeta: 10; missTolerance: 10; warmupTolerance: 2; maxTrack: 1; uiLoading: no; uiError: no; uiScanning: no"
  renderer="colorManagement: true; antialias: false; logarithmicDepthBuffer: false; precision: mediump; physicallyCorrectLights: true"
  loading-screen="enabled: false" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false" style="display:none;">

  <a-assets timeout="30000">
    <a-asset-item id="preload0" src="3d-model/almondcrustedcrispy/almondcrustedcrispy.glb"></a-asset-item>
  </a-assets>

  <a-light id="lAmb" type="ambient" color="#ffffff" intensity="0.5"></a-light>
  <a-light id="lKey" type="directional" color="#ffffff" intensity="0.9" position="1 3 2"></a-light>
  <a-light type="directional" color="#ffe9c0" intensity="0.5" position="-2 2 -1"></a-light>
  <a-light type="directional" color="#cce8ff" intensity="0.3" position="0 -1 2"></a-light>
  <a-light type="point" color="#fff5e0" intensity="0.6" position="0 1.5 1" distance="4" decay="2"></a-light>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target1" mindar-image-target="targetIndex: 0">
    <a-entity id="spinner"><a-entity id="modelEntity" position="0 0 0" rotation="0 0 0" scale="1 1 1" gltf-model=""></a-entity></a-entity>
  </a-entity>
</a-scene>

<script>
/* ══ RESTAURANT CONFIGURATION ══ */
const CONFIG={
  name:'Aurelia', tagline:'Japanese Kitchen',
  phone:'+917019743880',
  whatsapp:'917019743880',
  mapsUrl:'https://maps.google.com/?q=LIVE+DISH+AI+OOTY',
  spinMode:'spin',
  swayDeg:22,
  swaySeconds:7,
  spinDegPerSec:26,
  spinAxis:'z',
  exposure:1.05,
  envIntensity:0.4,
  shadowOpacity:0.38,
  revealStyle:'cloche',
  glints:false,
  steam:false,
  steamOpacity:0.4,
  sound:false,
  soundVolume:0.5,
  statusOffer:'Show this status at the counter and enjoy a free green tea 🍵',
  reelSeconds:10,
  waReelSeconds:6,
  hashtags:'#best_restaurant_ooty #ooty_tourism',
  festivalShowDays:21,
  festivals:[
    {name:'Diwali',    date:'2026-11-08', emoji:'🪔', offer:'Free gulab jamun with every ramen'},
    {name:'Christmas', date:'2026-12-25', emoji:'🎄', offer:'Free hot chocolate with any bowl'},
    {name:'New Year',  date:'2027-01-01', emoji:'🎆', offer:'Welcome 2027: 10% off on all bowls'},
    {name:'Pongal',    date:'2027-01-14', emoji:'🌾', offer:'Pongal special: free green tea with any bowl'}
  ],
  preload:true,
  tableEngine:'scene-viewer',

/* Model Loaders & Preloading */
const models=new Map(); let loadTok=0;
const mlText=$('#mlText'), mlFill=$('#mlFill'), mlPct=$('#mlPct');
function loadModel(url){
  let e=models.get(url); if(e) return e;
  e={loaded:0,total:0,done:false,subs:new Set()};
  e.promise=(async()=>{
    const res=await fetch(url); if(!res.ok) throw new Error('HTTP '+res.status);
    e.total=+res.headers.get('content-length')||0;
    let blob;
    if(res.body&&res.body.getReader){
      const rd=res.body.getReader(), parts=[];
      for(;;){const r=await rd.read(); if(r.done)break; parts.push(r.value); e.loaded+=r.value.length; e.subs.forEach(f=>f(e))}
      blob=new Blob(parts,{type:'model/gltf-binary'});
    }else blob=await res.blob();
    e.done=true; e.subs.forEach(f=>f(e));
    return URL.createObjectURL(blob);
  })();
  e.promise.catch(()=>models.delete(url));
  models.set(url,e); return e;
}
function setProgress(e,mode){
  modelLoader.classList.remove('indet');
  if(mode==='reset'){mlText.textContent='Loading dish'; mlFill.style.width='0%'; mlPct.textContent=''; return}
  if(mode==='prep'){mlText.textContent='Preparing 3D'; mlFill.style.width='100%'; mlPct.textContent=''; return}
  if(e.done){mlFill.style.width='100%'; mlPct.textContent='100%'; return}
  if(e.total){const p=Math.min(99,Math.floor(e.loaded/e.total*100)); mlFill.style.width=p+'%'; mlPct.textContent=p+'%'}
  else{modelLoader.classList.add('indet'); mlPct.textContent=''}
}
async function loadDishModel(dish,tok){
  const path=`3d-model/${dish.folder}/${dish.model}`; let src=path;
  try{
    const e=loadModel(path), sub=ev=>{if(tok===loadTok) setProgress(ev)};
    e.subs.add(sub); setProgress(e);
    src=await e.promise; e.subs.delete(sub);
  }catch(err){console.warn('Model download failed, loading directly',err)}
  if(tok!==loadTok) return;
  setProgress(null,'prep');
  applyModel(modelEntity,dish,1,src);
  preloadNeighbours(currentIndex);
}
function preloadNeighbours(i){
  if(!CONFIG.preload||(navigator.connection&&navigator.connection.saveData)) return;
  const n=dishes.length, list=[...new Set([(i+1)%n,(i-1+n)%n])].filter(j=>j!==i);
  setTimeout(async()=>{for(const j of list){if(currentIndex!==i) return; try{await loadModel(`3d-model/${dishes[j].folder}/${dishes[j].model}`).promise}catch(e){}}},700);
}

function hudFrame(){
  requestAnimationFrame(hudFrame);

  if(tablePaused) return;
  if(spinOn&&markerFound){
    if(CONFIG.spinMode==='sway'){swayT+=dt; const a=d2r(CONFIG.swayDeg)*Math.sin(swayT*2*Math.PI/CONFIG.swaySeconds); spinner.object3D.rotation[CONFIG.spinAxis]+=a-swayAng; swayAng=a}

  fbBar.appendChild(a);
});
dishes.forEach((d,i)=>{
  const t=document.createElement('div'); t.className='dish-thumb';
  t.innerHTML=`<div class="thumb-img-wrap"><img src="3d-model/${d.folder}/${d.thumb}" onerror="this.style.visibility='hidden'" alt="${d.name}" draggable="false"></div><span>${d.name}</span>`;
  t.addEventListener('click',()=>fbSelect(i)); fbCar.appendChild(t);
});
fbV.setAttribute('ar-modes',CONFIG.tableEngine==='webxr'?'webxr scene-viewer quick-look':'scene-viewer webxr quick-look');
fbV.addEventListener('load',()=>fbAR.classList.toggle('show',!!fbV.canActivateAR));
fbAR.addEventListener('click',()=>{try{fbV.activateAR()}catch(e){toast('Table view is not available on this phone')}});
function fbSelect(i){
  fbIdx=i; const d=dishes[i]; fbAR.classList.remove('show');
  fbV.setAttribute('src',`3d-model/${d.folder}/${d.model}`); fbV.setAttribute('alt',d.name);
  if(d.usdz) fbV.setAttribute('ios-src',`3d-model/${d.folder}/${d.usdz}`); else fbV.removeAttribute('ios-src');
  $('#fbName').textContent=d.name;
  $('#fbTags').innerHTML=[d.veg===undefined?'':`<span class="tag">${d.veg?'🟢 Veg':'🔴 Non-veg'}</span>`,d.spice?`<span class="tag">${'🌶'.repeat(d.spice)}</span>`:'',d.tag?`<span class="tag">★ ${d.tag}</span>`:''].join('');
  fbCar.querySelectorAll('.dish-thumb').forEach((el,j)=>el.classList.toggle('active',j===i));
}
function openFallback(reason){
  if(fbOpen) return; fbOpen=true; clearTimeout(fbLinkT);
  try{pauseAR(); const m=mindar(); if(m) Promise.resolve(m.stop()).catch(()=>{})}catch(e){}
  ['#arScene','#startScreen','#loadingOverlay','#errorOverlay','#actionBar','#modeToggle','#dishCarousel','#logo','#scanHint','#swipeZone','#swipeHint','#modelLoader','#fbLink'].forEach(q=>{const el=document.querySelector(q); if(el) el.style.display='none'});
  $('#fbNote').textContent=reason==='denied'?'The camera is off, so here is the 3D view. Allow the camera to see dishes on the menu card.'
    :reason==='manual'?'Turn each dish around with your finger.':'AR is not available on this phone, but you can still explore every dish in 3D.';
  fb.classList.add('show'); fbSelect(currentIndex>=0?currentIndex:0);
}
$('#fbRetry').addEventListener('click',()=>location.reload());
$('#fbFromErr').addEventListener('click',()=>openFallback('denied'));
fbLink.addEventListener('click',()=>openFallback('manual'));
function armFbLink(){
  clearTimeout(fbLinkT); if(fbOpen) return;
  fbLinkT=setTimeout(()=>{if(!markerFound&&!fbOpen&&arStarted&&!tableOpen) fbLink.classList.add('show')},15000);
}
arScene.addEventListener('arError',()=>openFallback('arerror'));

/* AR Initialization */
async function startAR(){
  if(arStarted||starting) return; starting=true;
  const sup=arSupport(); if(sup){starting=false; openFallback(sup); return}
  startScreen.style.opacity='0'; setTimeout(()=>startScreen.style.display='none',400);
  loadingOverlay.classList.add('show'); loadingStatus.textContent='Starting camera';
  try{
    const tries=[{facingMode:{exact:'environment'}},{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},true];
    let stream=null, lastErr=null;
    for(const vc of tries){try{stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:false});break}catch(e){lastErr=e; if(e&&e.name==='NotAllowedError')break}}
    if(!stream) throw lastErr||new Error('No camera');
    stream.getTracks().forEach(t=>t.stop());
    loadingStatus.textContent='Initialising AR';
    arScene.style.display='block';
    let fired=false;
    const onReady=()=>{
      if(fired) return; fired=true; if(fbOpen) return;
      loadingOverlay.classList.remove('show');
      scanHint.style.opacity='1'; arStarted=true;
      swipeZone.classList.add('active');
      alwaysVisible.forEach(el=>{el.style.opacity='1';el.style.pointerEvents='auto'});
      setupRender(); selectDish(0); showSwipeHintOnce(); armFbLink();
    };
    arScene.addEventListener('loaded',onReady,{once:true});
    arScene.addEventListener('arReady',onReady,{once:true});
    setTimeout(onReady,3000);
  }catch(err){
    console.error('Camera error:',err); starting=false;
    loadingOverlay.classList.remove('show');
    if(err&&err.name==='NotAllowedError'){errorOverlay.classList.add('show')}
    else{openFallback('camera')}
  }
}
['click','touchend'].forEach(evt=>{
  $('#startBtn').addEventListener(evt,e=>{e.preventDefault();startAR()});
  $('#retryBtn').addEventListener(evt,e=>{e.preventDefault();errorOverlay.classList.remove('show');startScreen.style.display='flex';startScreen.style.opacity='1'});
});

target.addEventListener('targetFound',()=>{markerFound=true;playEntry();scanHint.style.opacity='0'; clearTimeout(fbLinkT); fbLink.classList.remove('show')});
target.addEventListener('targetLost',()=>{markerFound=false;scanHint.style.opacity='1'; armFbLink()});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
