<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dish reveal ideas</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#231f16;--tx2:#6b6454;--bd:#e1d9c6;--gold:#b8902f;--sel:#fbf1d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0c09;--card:#17140f;--tx:#efe9d8;--tx2:#a39b86;--bd:#2c261a;--gold:#e8c97a;--sel:#2a2210}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px;font-weight:600}.sub{color:var(--tx2);margin:0 0 12px;font-size:13px}
#viewer{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
#vbox{position:relative;height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:#0b0a08}
#vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;pointer-events:none}
#vbox iframe.on{visibility:visible}
#bar{display:flex;gap:8px;align-items:center;margin-top:8px}
#now{flex:1;font-size:14px;min-width:0}
button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
li{display:flex;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);cursor:pointer}
li.on{background:var(--sel);border-color:var(--gold)}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1a1405;font-weight:600;font-size:13px;display:grid;place-items:center}
.t{font-weight:600}.d{color:var(--tx2);font-size:14px}.a{color:var(--gold);font-size:12.5px;margin-top:2px}
</style></head><body><div class="wrap">
<h1>Dish reveal ideas</h1><p class="sub">Tap any item to preview it on the ramen bowl.</p>
<div id="viewer"><div id="vbox"></div><div id="bar"><span id="now"></span><button id="rp">↻ Replay</button></div></div>
<ol id="list"></ol></div>
<script>
const DOCS={"std": "<!doctype html><html><head><meta charset=\"utf-8\"><style>\n:root{--text-secondary:#b9b2a2;--text-tertiary:#8a8474;--text-muted:#8a8474;--border:rgba(201,168,76,.25);--border-strong:rgba(201,168,76,.4);--border-stronger:rgba(232,201,122,.55);--surface-1:#12100d;--surface-2:#191611;--bg-accent:#3a2f12;--text-accent:#e8c97a;--border-accent:#c9a84c;--font-sans:system-ui,sans-serif}\nhtml,body{margin:0;background:#0b0a08;color:#e8e2d2;font-family:system-ui,sans-serif;overflow:hidden}\n.sr-only,#btns,#cap,#replay,#ask,#prevb,#nextb,div:has(>#replay){display:none!important}\n#stage{height:340px!important;border-radius:0!important;border:0!important}\n#wrap{border:0!important;border-radius:0!important}\n<\\/style><\\/head><body><div id=\"vis-container\">\n<style>\n#wrap{border-radius:14px;overflow:hidden;border:0.5px solid rgba(201,168,76,.3);background:#0b0a08;line-height:0}\n#cv{display:block;width:100%}\n.sty{font-size:13px;padding:6px 10px;min-height:34px}\n.sty.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}\n<\\/style>\n<div id=\"wrap\"><canvas id=\"cv\"><\\/canvas><\\/div>\n<div style=\"display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;gap:8px;flex-wrap:wrap\">\n  <span id=\"cap\" style=\"font-size:14px;color:var(--text-secondary);flex:1;min-width:200px\"><\\/span>\n  <span style=\"display:flex;gap:8px\">\n    <button id=\"replay\"><i class=\"ti ti-refresh\" aria-hidden=\"true\"><\\/i> Replay<\\/button>\n    <button id=\"ask\">Add this to my code \u2197<\\/button>\n  <\\/span>\n<\\/div>\n<div id=\"btns\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px\"><\\/div>\n<script>\nconst cv=document.getElementById('cv'),ctx=cv.getContext('2d');\nconst N=240,CX=120,CY=120,GOLD='#E8C97A';\nlet W=600,H=340,dpr=1,ox=0,oy=0;\nconst mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};\nconst cl=v=>Math.max(0,Math.min(1,v)),R=(a,b)=>a+Math.random()*(b-a);\nconst eo3=t=>1-Math.pow(1-t,3),eo4=t=>1-Math.pow(1-t,4),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;\nconst eoB=t=>{const c1=.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};\nfunction size(){W=cv.parentNode.clientWidth||600;H=340;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H*(W/W)+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ox=(W-N)/2;oy=(H-N)/2}\nfunction rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}\nfunction bg(){\n  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;\n  ctx.fillStyle='#0b0a08';ctx.fillRect(0,0,W,H);\n  ctx.fillStyle='rgba(201,168,76,.05)';ctx.beginPath();ctx.ellipse(W/2,H/2+112,130,18,0,0,6.283);ctx.fill();\n  ctx.strokeStyle='rgba(201,168,76,.22)';ctx.lineWidth=1;ctx.fillStyle='#14110c';rr(W/2-110,H/2-110,220,220,8);ctx.fill();ctx.stroke();\n  ctx.fillStyle='rgba(232,201,122,.3)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('MENU CARD',W/2,H/2+102);\n}\n\n/* \u2500\u2500 dish raster \u2500\u2500 */\nconst svg=`<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 120\" width=\"480\" height=\"480\"><g><path d=\"M10 58 Q10 105 60 105 Q110 105 110 58 Z\" fill=\"#FAECE7\" stroke=\"#993C1D\" stroke-width=\"2\"/><rect x=\"38\" y=\"104\" width=\"44\" height=\"6\" rx=\"3\" fill=\"#993C1D\"/><\\/g><g><ellipse cx=\"60\" cy=\"58\" rx=\"50\" ry=\"14\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"1.5\"/><\\/g><g><path d=\"M25 56 Q40 48 55 58 T85 56\" fill=\"none\" stroke=\"#FAEEDA\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M30 62 Q50 54 65 63 T95 60\" fill=\"none\" stroke=\"#FAC775\" stroke-width=\"3\" stroke-linecap=\"round\"/><\\/g><g><circle cx=\"45\" cy=\"52\" r=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"1.5\"/><circle cx=\"45\" cy=\"52\" r=\"4.5\" fill=\"#EF9F27\"/><circle cx=\"78\" cy=\"54\" r=\"8\" fill=\"#ED93B1\" stroke=\"#993556\" stroke-width=\"1.5\"/><path d=\"M60 48 l4 -14 l4 14 z\" fill=\"#639922\"/><path d=\"M68 50 l6 -12 l3 12 z\" fill=\"#97C459\"/><rect x=\"52\" y=\"56\" width=\"14\" height=\"6\" rx=\"2\" fill=\"#3B6D11\"/><\\/g><\\/svg>`;\nconst dc=mk(480,480),sc=mk(N,N),tmp=mk(N,N),oc=mk(N,N),rc=mk(120,120),tctx=tmp.getContext('2d'),octx=oc.getContext('2d'),rcx=rc.getContext('2d');\nlet src,od,pts=[],epts=[],rpts=[],nn,ord,snn,edgeC,meshC,darkC,chan=[];\nfunction prep(img){\n  dc.getContext('2d').drawImage(img,0,0,480,480);\n  const s=sc.getContext('2d');s.drawImage(dc,0,0,N,N);\n  src=s.getImageData(0,0,N,N).data;od=octx.createImageData(N,N);\n  for(let y=0;y<N;y+=3)for(let x=0;x<N;x+=3){const j=(y*N+x)*4;if(src[j+3]>140)pts.push({x,y,c:`rgb(${src[j]},${src[j+1]},${src[j+2]})`,r:src[j],g:src[j+1],b:src[j+2]})}\n  /* edges */\n  const g=new Float32Array(N*N);for(let i=0;i<N*N;i++){const a=src[i*4+3]/255;g[i]=a*(70+(.3*src[i*4]+.59*src[i*4+1]+.11*src[i*4+2])*.6)}\n  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x;\n    const gx=-g[i-N-1]-2*g[i-1]-g[i+N-1]+g[i-N+1]+2*g[i+1]+g[i+N+1],gy=-g[i-N-1]-2*g[i-N]-g[i-N+1]+g[i+N-1]+2*g[i+N]+g[i+N+1];\n    if(Math.hypot(gx,gy)>70)epts.push({x,y,ang:Math.atan2(y-CY,x-CX)});\n    if(src[i*4+3]>128&&(src[(i-1)*4+3]<128||src[(i+1)*4+3]<128||src[(i-N)*4+3]<128||src[(i+N)*4+3]<128))rpts.push({x,y,ang:Math.atan2(y-CY,x-CX)});\n  }\n  edgeC=mk(N,N);const e=edgeC.getContext('2d');e.fillStyle=GOLD;epts.forEach(p=>e.fillRect(p.x-.5,p.y-.5,1.5,1.5));\n  meshC=mk(N,N);const m=meshC.getContext('2d');m.strokeStyle='rgba(232,201,122,.6)';m.lineWidth=1;\n  for(let i=0;i<=N;i+=9){m.beginPath();m.moveTo(i,0);m.lineTo(i,N);m.stroke();m.beginPath();m.moveTo(0,i);m.lineTo(N,i);m.stroke()}\n  m.globalCompositeOperation='destination-in';m.drawImage(sc,0,0);\n  darkC=mk(N,N);const d=darkC.getContext('2d');d.drawImage(dc,0,0,N,N);d.globalCompositeOperation='source-atop';d.fillStyle='rgba(6,5,4,.93)';d.fillRect(0,0,N,N);\n  [['#f00'],['#0f0'],['#00f']].forEach(([col])=>{const c=mk(N,N),x=c.getContext('2d');x.drawImage(dc,0,0,N,N);x.globalCompositeOperation='multiply';x.fillStyle=col;x.fillRect(0,0,N,N);x.globalCompositeOperation='destination-in';x.drawImage(sc,0,0);chan.push(c)});\n  /* noise for burn dissolve */\n  const vn=(gs)=>{const gr=[];for(let i=0;i<=gs;i++){gr[i]=[];for(let j=0;j<=gs;j++)gr[i][j]=Math.random()}return(x,y)=>{const fx=x/N*gs,fy=y/N*gs,i=Math.floor(fx),j=Math.floor(fy),u=fx-i,v=fy-j,su=u*u*(3-2*u),sv=v*v*(3-2*v);return(gr[j][i]*(1-su)+gr[j][i+1]*su)*(1-sv)+(gr[j+1][i]*(1-su)+gr[j+1][i+1]*su)*sv}};\n  const n1=vn(6),n2=vn(14),n3=vn(30);nn=new Float32Array(N*N);const idx=[];\n  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;nn[i]=(n1(x,y)*.55+n2(x,y)*.3+n3(x,y)*.15)*.55+(1-y/N)*.45;if(src[i*4+3]>8)idx.push(i)}\n  idx.sort((a,b)=>nn[a]-nn[b]);ord=Int32Array.from(idx);snn=Float32Array.from(idx.map(i=>nn[i]));\n}\nconst dish=(a,x,y,w,h)=>{ctx.globalAlpha=a;ctx.drawImage(dc,x||0,y||0,w||N,h||N);ctx.globalAlpha=1};\n\n/* \u2500\u2500 11 CG styles \u2500\u2500 */\nconst S=[\n{n:'Particle assemble',dur:3,trail:true,ar:'Medium in AR: particles spawned from the model surface',d:'Thousands of glowing particles in the dish\\'s own colours swirl in from all around and lock together, leaving soft light trails.',\n init(){return pts.map(p=>({x:p.x,y:p.y,c:p.c,d:Math.random()*.32,a:Math.random()*6.283,r:150+Math.random()*260,s:1.8+Math.random()*2.2}))},\n draw(t){for(const p of this.P){const q=eo3(cl((t-p.d)/.62)),k=1-q,ang=k*2.4,v0x=Math.cos(p.a)*p.r,v0y=Math.sin(p.a)*p.r*.7;\n   const vx=v0x*Math.cos(ang)-v0y*Math.sin(ang),vy=v0x*Math.sin(ang)+v0y*Math.cos(ang);\n   ctx.globalAlpha=Math.min(1,q*3)*.95;ctx.fillStyle=p.c;ctx.fillRect(p.x+vx*k,p.y+vy*k,p.s,p.s)}\n   ctx.globalAlpha=1;if(t>.78)dish(cl((t-.78)/.22))}},\n{n:'Ash assemble',dur:3,trail:true,ar:'Medium in AR: same particle system, wind direction',d:'Fine ash blows in from the right in a wave, like a disintegration played backwards, and rebuilds the dish from left to right.',\n init(){return pts.map(p=>({x:p.x,y:p.y,r:p.r,g:p.g,b:p.b,d:(1-p.x/N)*.42+Math.random()*.08,ox:R(120,330),oy:R(-170,-20),ph:R(0,6.28),s:1.4+Math.random()*1.6}))},\n draw(t){for(const p of this.P){const q=eo4(cl((t-p.d)/.5)),k=1-q,turb=Math.sin(q*14+p.ph)*k*16,m=k*.7;\n   ctx.globalAlpha=Math.min(1,q*2.5);ctx.fillStyle=`rgb(${p.r+(110-p.r)*m|0},${p.g+(110-p.g)*m|0},${p.b+(110-p.b)*m|0})`;ctx.fillRect(p.x+p.ox*Math.pow(k,1.3),p.y+p.oy*Math.pow(k,1.3)+turb,p.s,p.s)}\n   ctx.globalAlpha=1;if(t>.8)dish(cl((t-.8)/.2))}},\n{n:'Burn dissolve',dur:2.6,ar:'Easy in AR: noise-based dissolve shader with glowing edge',d:'The dish burns into existence from the bottom up through a noise mask, with a white-hot orange edge and rising embers.',\n draw(t){const k=t*t*(3-2*t),thr=-.03+1.16*k,w=.075,d=od.data;\n   for(let i=0;i<N*N;i++){const j=i*4,a=src[j+3];if(a<8){d[j+3]=0;continue}const n=nn[i];\n     if(n>=thr){d[j+3]=0;continue}\n     if(n<thr-w){d[j]=src[j];d[j+1]=src[j+1];d[j+2]=src[j+2];d[j+3]=a;continue}\n     const e=(n-(thr-w))/w;let r,g,b;\n     if(e<.5){const q=e*2;r=src[j]+(255-src[j])*q;g=src[j+1]+(110-src[j+1])*q;b=src[j+2]+(25-src[j+2])*q}else{const q=(e-.5)*2;r=255;g=110+130*q;b=25+175*q}\n     d[j]=r;d[j+1]=g;d[j+2]=b;d[j+3]=a}\n   octx.putImageData(od,0,0);\n   ctx.save();ctx.shadowColor='rgba(255,140,40,.95)';ctx.shadowBlur=16;ctx.drawImage(oc,0,0);ctx.restore();ctx.drawImage(oc,0,0);\n   if(t<.96){let lo=0,hi=snn.length;while(lo<hi){const m=(lo+hi)>>1;snn[m]<thr?lo=m+1:hi=m}\n     for(let q=0;q<36;q++){const id=ord[Math.max(0,Math.min(ord.length-1,lo+Math.floor(R(-110,6))))],x=id%N,y=(id/N)|0;\n       ctx.globalAlpha=R(.35,1);ctx.fillStyle=Math.random()<.5?'#ffb347':'#ff7a1c';ctx.beginPath();ctx.arc(x+R(-6,6),y-R(4,40),R(.7,2),0,6.283);ctx.fill()}ctx.globalAlpha=1}}},\n{n:'Wireframe to render',dur:3.2,ar:'Easy in AR: wireframe material, then switch to the solid one',d:'A gold mesh and outline scan across the dish like a 3D modelling view, then the real render fills in from the bottom with a bright scan line.',\n draw(t){const pA=cl(t/.38),pB=cl((t-.3)/.5),pC=cl((t-.72)/.28),sx=Math.min(N,eo3(pA)*(N+10)),y0=N*(1-eio(pB));\n   if(pB>0){ctx.save();ctx.beginPath();ctx.rect(0,y0,N,N-y0);ctx.clip();ctx.drawImage(dc,0,0,N,N);ctx.restore()}\n   const fade=1-pC;\n   ctx.save();ctx.shadowColor='rgba(232,201,122,.9)';ctx.shadowBlur=9;\n   ctx.beginPath();ctx.rect(0,0,sx,y0);ctx.clip();ctx.globalAlpha=fade;ctx.drawImage(meshC,0,0);ctx.drawImage(edgeC,0,0);ctx.restore();\n   if(pB>0){ctx.save();ctx.beginPath();ctx.rect(0,y0,sx,N-y0);ctx.clip();ctx.globalAlpha=.3*fade;ctx.drawImage(edgeC,0,0);ctx.restore()}\n   if(pA<1&&pA>0){ctx.fillStyle='rgba(255,240,190,.9)';ctx.shadowColor=GOLD;ctx.shadowBlur=14;ctx.fillRect(sx-1,10,2,N-20);ctx.shadowBlur=0}\n   if(pB>0&&pB<1){ctx.fillStyle='rgba(255,255,255,.95)';ctx.shadowColor=GOLD;ctx.shadowBlur=16;ctx.fillRect(10,y0-1,N-20,2.4);ctx.shadowBlur=0}\n   ctx.globalAlpha=1}},\n{n:'RGB glitch assemble',dur:2,ar:'Easy in AR: three offset copies and a short post effect',d:'The dish stutters in with red, green and blue channels split apart and sliced bands jumping sideways, then locks into place.',\n draw(t){const a=Math.pow(1-t,1.6),bh=10;ctx.globalCompositeOperation='lighter';\n   if(t<.94&&(Math.random()>a*.5||t>.5)){\n     for(let by=0;by<N;by+=bh){const jump=Math.random()<.55*a?R(-1,1)*a*46:0;\n       chan.forEach((c,ci)=>{const sh=(ci-1)*a*13;ctx.drawImage(c,0,by,N,bh,jump+sh,by,N,bh)})}}\n   ctx.globalCompositeOperation='source-over';\n   ctx.fillStyle=`rgba(0,0,0,${.28*a})`;for(let y=0;y<N;y+=3)ctx.fillRect(0,y,N,1);\n   if(t>=.94)dish(1)}},\n{n:'Pixel resolve',dur:2.4,ar:'Medium in AR: resolution-step post effect',d:'Like a render resolving: it starts as huge blocks of colour and sharpens step by step into the final dish with a soft exposure flash.',\n draw(t){const u=eo3(cl(t/.92)),bs=Math.max(1,Math.round(70*Math.pow(1-u,2.3))),n=Math.ceil(N/bs),sm=mk(n,n);sm.getContext('2d').drawImage(sc,0,0,n,n);\n   const th=tctx;th.clearRect(0,0,N,N);th.imageSmoothingEnabled=bs<2;th.drawImage(sm,0,0,n*bs,n*bs);th.imageSmoothingEnabled=true;\n   th.globalCompositeOperation='source-atop';th.fillStyle=`rgba(255,255,255,${.55*(1-u)})`;th.fillRect(0,0,N,N);th.globalCompositeOperation='source-over';\n   ctx.globalAlpha=cl(t*8);ctx.drawImage(tmp,0,0);ctx.globalAlpha=1;if(t>.94)dish(cl((t-.94)/.06))}},\n{n:'Shockwave refraction',dur:2.2,ar:'Medium in AR: expanding ring plus a slight distortion pass',d:'A shockwave ring expands from the centre, bending the picture as it passes and splitting the colours, revealing the dish behind it.',\n draw(t){const r=eo3(cl(t/.8))*190,w=28,A=18*(1-t),d=od.data;\n   ctx.translate(R(-1,1)*A*.12,R(-1,1)*A*.12);\n   for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,j=i*4,dx=x-CX,dy=y-CY,dd=Math.sqrt(dx*dx+dy*dy);\n     if(dd>r+w){d[j+3]=0;continue}\n     let sh=0;const df=dd-r;if(Math.abs(df)<w){const k=1-Math.abs(df)/w;sh=A*k*k*Math.sin(df/w*Math.PI)}\n     const ux=dd?dx/dd:0,uy=dd?dy/dd:0;\n     const ir=Math.max(0,Math.min(N-1,Math.round(x-ux*sh*1.4)))+Math.max(0,Math.min(N-1,Math.round(y-uy*sh*1.4)))*N;\n     const ig=Math.max(0,Math.min(N-1,Math.round(x-ux*sh)))+Math.max(0,Math.min(N-1,Math.round(y-uy*sh)))*N;\n     const ib=Math.max(0,Math.min(N-1,Math.round(x-ux*sh*.6)))+Math.max(0,Math.min(N-1,Math.round(y-uy*sh*.6)))*N;\n     d[j]=src[ir*4];d[j+1]=src[ig*4+1];d[j+2]=src[ib*4+2];d[j+3]=src[ig*4+3]*(dd<r?1:1-(dd-r)/w)}\n   octx.putImageData(od,0,0);ctx.drawImage(oc,0,0);\n   if(t<.9){ctx.lineWidth=3;ctx.strokeStyle=`rgba(255,236,170,${(1-t)*.95})`;ctx.shadowColor=GOLD;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(CX,CY,r,0,6.283);ctx.stroke();\n     ctx.lineWidth=1;ctx.strokeStyle=`rgba(255,255,255,${(1-t)*.6})`;ctx.beginPath();ctx.arc(CX,CY,r-5,0,6.283);ctx.stroke();ctx.shadowBlur=0}}},\n{n:'Rim light and god rays',dur:3.2,ar:'Medium in AR y(e.data.play)})<\\/script><\\/body><\\/html>", "p2": "<!doctype html><html><head><meta charset=\"utf-8\"><style>\n:root{--text-secondary:#b9b2a2;--text-tertiary:#8a8474;--text-muted:#8a8474;--border:rgba(201,168,76,.25);--border-strong:rgba(201,168,76,.4);--border-stronger:rgba(232,201,122,.55);--surface-1:#12100d;--surface-2:#191611;--bg-accent:#3a2f12;--text-accent:#e8c97a;--border-accent:#c9a84c;--font-sans:system-ui,sans-serif}\nhtml,body{margin:0;background:#0b0a08;color:#e8e2d2;font-family:system-ui,sans-serif;overflow:hidden}\n.sr-only,#btns,#cap,#replay,#ask,#prevb,#nextb,div:has(>#replay){display:none!important}\n#stage{height:340px!important;border-radius:0!important;border:0!important}\n#wrap{border:0!important;border-radius:0!important}\n<\\/style><\\/head><body><div id=\"vis-container\">\n<style>\n#wrap{border-radius:14px;overflow:hidden;border:0.5px solid rgba(201,168,76,.3);background:#0b0a08;line-height:0}\n#cv{display:block;width:100%}\n.sty{font-size:12.5px;padding:6px 8px;min-height:34px}\n.sty.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}\n<\\/style>\n<div id=\"wrap\"><canvas id=\"cv\"><\\/canvas><\\/div>\n<div style=\"display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;gap:8px;flex-wrap:wrap\">\n  <span id=\"cap\" style=\"font-size:14px;color:var(--text-secondary);flex:1;min-width:200px\"><\\/span>\n  <span style=\"display:flex;gap:8px\">\n    <button id=\"prevb\">\u2039<\\/button>\n    <button id=\"replay\"><i class=\"ti ti-refresh\" aria-hidden=\"true\"><\\/i> Replay<\\/button>\n    <button id=\"nextb\">\u203a<\\/button>\n    <button id=\"ask\">Add this to my code \u2197<\\/button>\n  <\\/span>\n<\\/div>\n<div id=\"btns\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px\"><\\/div>\n<script>\nconst cv=document.getElementById('cv'),ctx=cv.getContext('2d');\nconst N=240,CX=120,CY=120,GOLD='#E8C97A',CH='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ<>/+*';\nlet W=600,H=340,dpr=1,ox=0,oy=0;\nconst mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};\nconst cl=v=>Math.max(0,Math.min(1,v)),R=(a,b)=>a+Math.random()*(b-a);\nconst eo3=t=>1-Math.pow(1-t,3),eo4=t=>1-Math.pow(1-t,4),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;\nconst eoB=t=>{const c1=.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};\nfunction size(){W=cv.parentNode.clientWidth||600;H=340;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ox=(W-N)/2;oy=(H-N)/2}\nfunction rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}\nfunction bg(){\n  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;\n  ctx.fillStyle='#0b0a08';ctx.fillRect(0,0,W,H);\n  ctx.fillStyle='rgba(201,168,76,.05)';ctx.beginPath();ctx.ellipse(W/2,H/2+112,130,18,0,0,6.283);ctx.fill();\n  ctx.strokeStyle='rgba(201,168,76,.22)';ctx.lineWidth=1;ctx.fillStyle='#14110c';rr(W/2-110,H/2-110,220,220,8);ctx.fill();ctx.stroke();\n  ctx.fillStyle='rgba(232,201,122,.3)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('MENU CARD',W/2,H/2+102);\n}\n\n/* dish raster + precomputed maps */\nconst svg=`<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 120\" width=\"480\" height=\"480\"><g><path d=\"M10 58 Q10 105 60 105 Q110 105 110 58 Z\" fill=\"#FAECE7\" stroke=\"#993C1D\" stroke-width=\"2\"/><rect x=\"38\" y=\"104\" width=\"44\" height=\"6\" rx=\"3\" fill=\"#993C1D\"/><\\/g><g><ellipse cx=\"60\" cy=\"58\" rx=\"50\" ry=\"14\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"1.5\"/><\\/g><g><path d=\"M25 56 Q40 48 55 58 T85 56\" fill=\"none\" stroke=\"#FAEEDA\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M30 62 Q50 54 65 63 T95 60\" fill=\"none\" stroke=\"#FAC775\" stroke-width=\"3\" stroke-linecap=\"round\"/><\\/g><g><circle cx=\"45\" cy=\"52\" r=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"1.5\"/><circle cx=\"45\" cy=\"52\" r=\"4.5\" fill=\"#EF9F27\"/><circle cx=\"78\" cy=\"54\" r=\"8\" fill=\"#ED93B1\" stroke=\"#993556\" stroke-width=\"1.5\"/><path d=\"M60 48 l4 -14 l4 14 z\" fill=\"#639922\"/><path d=\"M68 50 l6 -12 l3 12 z\" fill=\"#97C459\"/><rect x=\"52\" y=\"56\" width=\"14\" height=\"6\" rx=\"2\" fill=\"#3B6D11\"/><\\/g><\\/svg>`;\nconst dc=mk(480,480),sc=mk(N,N),tmp=mk(N,N),oc=mk(N,N),smC=mk(N,N),tctx=tmp.getContext('2d'),octx=oc.getContext('2d');\nlet src,od,pts=[],epts=[],nz,goldC,chromeC,darkC,puffC;\nfunction tint(fn){const c=mk(N,N),x=c.getContext('2d'),im=x.createImageData(N,N),d=im.data;for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const j=(y*N+xx)*4,a=src[j+3];if(a<4)continue;const l=(.3*src[j]+.59*src[j+1]+.11*src[j+2])/255,c3=fn(l,xx,y);d[j]=c3[0];d[j+1]=c3[1];d[j+2]=c3[2];d[j+3]=a}x.putImageData(im,0,0);return c}\nfunction prep(img){\n  dc.getContext('2d').drawImage(img,0,0,480,480);\n  const s=sc.getContext('2d');s.drawImage(dc,0,0,N,N);\n  src=s.getImageData(0,0,N,N).data;od=octx.createImageData(N,N);\n  for(let y=0;y<N;y+=3)for(let x=0;x<N;x+=3){const j=(y*N+x)*4;if(src[j+3]>140)pts.push({x,y,c:`rgb(${src[j]},${src[j+1]},${src[j+2]})`})}\n  const g=new Float32Array(N*N);for(let i=0;i<N*N;i++){const a=src[i*4+3]/255;g[i]=a*(70+(.3*src[i*4]+.59*src[i*4+1]+.11*src[i*4+2])*.6)}\n  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x,gx=-g[i-N-1]-2*g[i-1]-g[i+N-1]+g[i-N+1]+2*g[i+1]+g[i+N+1],gy=-g[i-N-1]-2*g[i-N]-g[i-N+1]+g[i+N-1]+2*g[i+N]+g[i+N+1];if(Math.hypot(gx,gy)>70)epts.push({x,y,ang:Math.atan2(y-CY,x-CX)})}\n  goldC=tint(l=>{const k=Math.pow(l,.8);return[70+185*k,45+170*k,8+120*k*k]});\n  chromeC=tint((l,x,y)=>{const v=Math.max(20,Math.min(255,35+190*Math.pow(l,.85)+34*Math.sin(l*10+y*.05)));return[v*.93,v*.97,Math.min(255,v*1.06)]});\n  darkC=mk(N,N);{const d=darkC.getContext('2d');d.drawImage(dc,0,0,N,N);d.globalCompositeOperation='source-atop';d.fillStyle='rgba(6,5,4,.93)';d.fillRect(0,0,N,N)}\n  puffC=mk(64,64);{const x=puffC.getContext('2d'),gr=x.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(190,190,195,.9)');gr.addColorStop(1,'rgba(190,190,195,0)');x.fillStyle=gr;x.fillRect(0,0,64,64)}\n  const vn=gs=>{const gr=[];for(let i=0;i<=gs;i++){gr[i]=[];for(let j=0;j<=gs;j++)gr[i][j]=Math.random()}return(x,y)=>{const fx=x/N*gs,fy=y/N*gs,i=Math.floor(fx),j=Math.floor(fy),u=fx-i,v=fy-j,su=u*u*(3-2*u),sv=v*v*(3-2*v);return(gr[j][i]*(1-su)+gr[j][i+1]*su)*(1-sv)+(gr[j+1][i]*(1-su)+gr[j+1][i+1]*su)*sv}};\n  const n1=vn(6),n2=vn(14),n3=vn(30);nz=new Float32Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)nz[y*N+x]=n1(x,y)*.55+n2(x,y)*.3+n3(x,y)*.15;\n}\nconst dish=(a,x,y,w,h)=>{ctx.globalAlpha=a;ctx.drawImage(dc,x||0,y||0,w||N,h||N);ctx.globalAlpha=1};\nconst smpj=(x,y)=>{x=x<0?0:x>239?239:(x+.5)|0;y=y<0?0:y>239?239:(y+.5)|0;return(y*N+x)*4};\nfunction pp(fn){const d=od.data;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;fn(x,y,i,i*4,d)}octx.putImageData(od,0,0)}\nfunction waveClip(y,ph,amp){ctx.beginPath();ctx.moveTo(-5,N+5);ctx.lineTo(-5,y+Math.sin(-5*.045+ph)*amp);for(let x=0;x<=N+5;x+=6)ctx.lineTo(x,y+Math.sin(x*.045+ph)*amp);ctx.lineTo(N+5,N+5);ctx.closePath()}\n\nconst S=[\n/* 1 */{n:'Liquid gold flood',dur:3,ar:'Medium in AR: gold material with a rising clip plane',d:'Wavy liquid gold fills the dish from the bottom up, then true colour rises through it and pushes the gold out the top.',\n draw(t){const p1=cl(t/.5),p2=cl((t-.35)/.55),y1=N+14-(N+28)*eio(p1),y2=N+14-(N+28)*eio(p2);\n  ctx.save();waveClip(y1,t*14,6);ctx.clip();ctx.drawImage(goldC,0,0);ctx.restore();\n  if(p2>0){ctx.save();waveClip(y2,t*12+2,5);ctx.clip();ctx.drawImage(dc,0,0,N,N);ctx.restore()}\n  if(p1<1&&p1>0){ctx.strokeStyle='rgba(255,246,200,.9)';ctx.lineWidth=1.6;ctx.shadowColor=GOLD;ctx.shadowBlur=8;ctx.beginPath();for(let x=0;x<=N;x+=4){const y=y1+Math.sin(x*.045+t*14)*6;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.shadowBlur=0}}},\n/* 2 */{n:'Ink bloom',dur:2.6,ar:'Medium in AR: noise-mask shader spreading from several points',d:'Colour spreads outward from several seed points like ink in wet paper, with darker pigment at the edges of each bloom.',\n init(){return Array.from({length:5},()=>{const p=pts[(Math.random()*pts.length)|0];return[p.x,p.y]})},\n draw(t){const r=eo3(cl(t/.9))*230,Sd=this.P;pp((x,y,i,j,d)=>{const a=src[j+3];if(a<8){d[j+3]=0;return}let m=1e9;for(let k=0;k<Sd.length;k++){const dx=x-Sd[k][0],dy=y-Sd[k][1],q=dx*dx+dy*dy;if(q<m)m=q}\n   const v=r-Math.sqrt(m)+(nz[i]-.5)*46;if(v<0){d[j+3]=0;return}const k=v<8?v/8:1,dk=1-k;d[j]=src[j]*(1-dk*.5)+9*dk;d[j+1]=src[j+1]*(1-dk*.5);d[j+2]=src[j+2]*(1-dk*.4)+18*dk;d[j+3]=a});ctx.drawImage(oc,0,0)}},\n/* 3 */{n:'Block build',dur:2.6,ar:'Medium in AR: cube mesh, or falling tiles as an approximation',d:'The dish is built from small blocks that drop in from above, bottom rows first, each bouncing slightly as it lands.',\n init(){const cs=8,c=[];for(let gy=0;gy<30;gy++)for(let gx=0;gx<30;gx++){const x=gx*cs,y=gy*cs;if(src[(Math.min(N-1,y+4)*N+Math.min(N-1,x+4))*4+3]<20&&src[(y*N+x)*4+3]<20)continue;c.push({x,y,d:(1-y/N)*.5+R(0,.14),h:R(110,260)})}return c},\n draw(t){const cs=8;for(const c of this.P){const q=cl((t-c.d)/.34);if(q<=0)continue;let off=-c.h*(1-q*q);if(q>=1){const bq=cl((t-c.d-.34)/.22);off=-Math.abs(Math.sin(bq*Math.PI*2.2))*(1-bq)*7}\n   ctx.globalAlpha=Math.min(1,q*4);ctx.drawImage(sc,c.x,c.y,cs,cs,c.x,c.y+off,cs,cs);if(off<-1){ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.fillRect(c.x,c.y+off,cs,cs)}}ctx.globalAlpha=1}},\n/* 4 */{n:'Slice slide',dur:2.2,ar:'Easy in AR: horizontal clip bands that slide in',d:'The dish is cut into 24 horizontal slices that slide in from alternating sides in a random order and snap together.',\n init(){return[...Array(24).keys()].sort(()=>Math.random()-.5)},\n draw(t){for(let i=0;i<24;i++){const d=this.P[i]*.02,q=eo4(cl((t-d)/.62));if(q<=0)continue;ctx.globalAlpha=Math.min(1,q*3);ctx.drawImage(dc,0,i*20,480,20,(i%2?1:-1)*330*(1-q),i*10,N,10)}ctx.globalAlpha=1}},\n/* 5 */{n:'Vortex funnel',dur:3,trail:true,ar:'Medium in AR: spiral particles that collapse onto the model',d:'Particles spin in a tall funnel above the card, tighten into a tornado and pour down into the dish.',\n init(){return pts.map(p=>({x:p.x,y:p.y,c:p.c,a:R(0,6.283),h:Math.random(),d:Math.random()*.25,s:1.6+Math.random()*2}))},\n draw(t){for(const p of this.P){const u=eio(cl((t-p.d)/.78)),ang=p.a+t*10*(1-u*.4),Rf=14+(1-p.h)*100,fx=CX+Math.cos(ang)*Rf,fy=CY-160+p.h*150+Math.sin(ang)*Rf*.3;\n   ctx.globalAlpha=cl((t-p.d)*10)*.95;ctx.fillStyle=p.c;ctx.fillRect(fx+(p.x-fx)*u,fy+(p.y-fy)*u,p.s,p.s)}ctx.globalAlpha=1;if(t>.8)dish(cl((t-.8)/.2))}},\n/* 6 */{n:'Neon trace',dur:3,ar:'Easy to medium in AR: glowing outline, then the model fades in',d:'A neon outline is drawn around the dish by a bright moving head, then colour fills in and the glow fades.',\n init(){return epts.slice().sort((a,b)=>a.ang-b.ang)},\n draw(t){const ph=cl(t/.6),head=-Math.PI+ph*6.283,tc=tctx;tc.clearRect(0,0,N,N);let hx=0,hy=0,hn=0;\n  for(const p of this.P){if(p.ang>head)break;const k=cl(1-(head-p.ang)/1.4);tc.fillStyle=`rgba(255,${210+k*40|0},${130+k*100|0},${.4+.6*k})`;tc.fillRect(p.x-.7,p.y-.7,1.8,1.8);if(head-p.ang<.06){hx+=p.x;hy+=p.y;hn++}}\n  ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='rgba(255,200,90,1)';ctx.shadowBlur=10;ctx.globalAlpha=1-cl((t-.7)/.3)*.7;ctx.drawImage(tmp,0,0);ctx.drawImage(tmp,0,0);ctx.restore();\n  if(hn&&ph<1){const x=hx/hn,y=hy/hn,g=ctx.createRadialGradient(x,y,0,x,y,26);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,200,90,0)');ctx.fillStyle=g;ctx.fillRect(x-26,y-26,52,52)}\n  const f=cl((t-.55)/.38);if(f>0)dish(eio(f))}},\n/* 7 */{n:'Aperture open',dur:2,ar:'Easy in AR: screen-space mask over the camera view',d:'An eight-blade camera aperture opens from the centre while rotating, with a glowing gold edge, u
